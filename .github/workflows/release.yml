name: Release

on:
    workflow_dispatch:
    push:
        branches:
            - master

permissions:
    actions: write
    contents: write
    # npm trusted publishing and provenance use this job's OIDC id-token.
    id-token: write
    pull-requests: write

concurrency:
    group: release-master
    cancel-in-progress: false

env:
    FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
    release:
        name: Release
        runs-on: ubuntu-latest
        timeout-minutes: 90

        steps:
            - name: Checkout
              uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
              with:
                  fetch-depth: 0

            - name: Setup pnpm
              uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
              with:
                  run_install: false

            # npm trusted publishing needs npm 11.5.1 or later, which Node 24.5.0
            # and later bundle; Node 22 bundles npm 10.
            - name: Setup Node
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
              with:
                  node-version: 24
                  cache: pnpm
                  cache-dependency-path: pnpm-lock.yaml
                  registry-url: https://registry.npmjs.org

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Create release PR or publish packages
              uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
              with:
                  version: pnpm version-packages
                  publish: pnpm release:packages
                  title: Version Packages
                  commit: Version Packages
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  # npm publishes with npm trusted publishing. Each package's
                  # trusted publisher on npmjs.com names this repository and
                  # release.yml, has no environment, and allows npm publish.
                  # While the NPM_TOKEN secret is set, npm sends it with every
                  # registry request in this step, and publishes with it
                  # without a warning when the OIDC exchange fails. Delete the
                  # secret once a release has published through trusted
                  # publishing; both variables are then empty.
                  NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
                  NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
                  NPM_CONFIG_PROVENANCE: true
