name: Shared FS Native OS Smoke

# The macOS macFUSE mount smoke on a physical Scaleway Mac. macFUSE needs a
# kernel extension approved in System Settings, which GitHub-hosted runners
# cannot load. Hosted Linux and Windows (WinFsp) mounts run in Shared FS
# Native Smoke. The janitor still covers the pooled Scaleway Windows
# host that Shared FS Native Cross-OS Interop uses.
on:
    workflow_dispatch:
        inputs:
            operation:
                description: Run native smoke tests or cleanup stale runners.
                required: true
                default: smoke
                type: choice
                options:
                    - smoke
                    - janitor
            mounted_benchmark:
                description: Collect report-only mounted and local-control filesystem benchmarks during smoke runs.
                required: true
                default: false
                type: boolean
    schedule:
        - cron: "17 */6 * * *"

permissions:
    contents: read

concurrency:
    group: shared-fs-native-scaleway
    cancel-in-progress: false

env:
    SCALEWAY_ZONE: ${{ vars.PEERBIT_SCALEWAY_ZONE || 'fr-par-1' }}
    PEERBIT_GITHUB_RUNNER_VERSION: ${{ vars.PEERBIT_GITHUB_RUNNER_VERSION || '2.330.0' }}
    FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
    janitor:
        name: Cleanup stale Scaleway native runners
        if: ${{ github.event_name == 'schedule' || github.event.inputs.operation == 'janitor' }}
        runs-on: ubuntu-latest
        timeout-minutes: 20
        steps:
            - name: Checkout
              uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

            - name: Run janitors
              shell: bash
              env:
                  GH_TOKEN: ${{ secrets.PEERBIT_RUNNER_ADMIN_TOKEN }}
                  ACCESS_KEY_ID: ${{ secrets.SCALEWAY_ACCESS_KEY_ID }}
                  SECRET_ACCESS_KEY: ${{ secrets.SCALEWAY_SECRET_ACCESS_KEY }}
                  SCALEWAY_PROJECT_ID: ${{ secrets.SCALEWAY_PROJECT_ID }}
              run: |
                  set -euo pipefail
                  if [ -z "${ACCESS_KEY_ID:-}" ] || [ -z "${SECRET_ACCESS_KEY:-}" ]; then
                    echo "Scaleway secrets are not configured; skipping janitor."
                    exit 0
                  fi
                  node scripts/github-scaleway-runner.mjs janitor || true
                  node scripts/github-scaleway-windows-runner.mjs janitor || true
                  node scripts/shared-fs-scaleway-resource-check.mjs \
                    --repo "${GITHUB_REPOSITORY##*/}" \
                    --mac-max 1 \
                    --windows-max 1 \
                    --skip-missing-credentials

    provision-macos:
        name: Provision reusable physical macOS host + ephemeral GitHub runner
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.operation == 'smoke' }}
        runs-on: ubuntu-latest
        timeout-minutes: 30
        outputs:
            runs_on: ${{ steps.labels.outputs.runs_on }}
        steps:
            - name: Checkout
              uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

            - name: Compute runner labels
              id: labels
              shell: bash
              run: |
                  set -euo pipefail
                  label="peerbit-shared-fs-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-macos"
                  echo "unique_label=$label" >> "$GITHUB_OUTPUT"
                  node -e 'console.log("runs_on=" + JSON.stringify(["self-hosted","macOS","scaleway",process.argv[1]]))' "$label" >> "$GITHUB_OUTPUT"

            - name: Prepare SSH key
              shell: bash
              env:
                  PEERBIT_SCALEWAY_SSH_PRIVATE_KEY: ${{ secrets.PEERBIT_SCALEWAY_SSH_PRIVATE_KEY }}
              run: |
                  set -euo pipefail
                  if [ -z "${PEERBIT_SCALEWAY_SSH_PRIVATE_KEY:-}" ]; then
                    echo "Missing PEERBIT_SCALEWAY_SSH_PRIVATE_KEY secret."
                    exit 1
                  fi
                  printf '%s\n' "$PEERBIT_SCALEWAY_SSH_PRIVATE_KEY" > "$RUNNER_TEMP/scaleway_ssh"
                  chmod 600 "$RUNNER_TEMP/scaleway_ssh"
                  ssh-keygen -y -f "$RUNNER_TEMP/scaleway_ssh" > "$RUNNER_TEMP/scaleway_ssh.pub"

            - name: Start runner
              env:
                  GH_TOKEN: ${{ secrets.PEERBIT_RUNNER_ADMIN_TOKEN }}
                  ACCESS_KEY_ID: ${{ secrets.SCALEWAY_ACCESS_KEY_ID }}
                  SECRET_ACCESS_KEY: ${{ secrets.SCALEWAY_SECRET_ACCESS_KEY }}
                  SCALEWAY_PROJECT_ID: ${{ secrets.SCALEWAY_PROJECT_ID }}
                  SCALEWAY_SERVER_TYPE: ${{ vars.PEERBIT_SCALEWAY_MACOS_SERVER_TYPE || 'M2-M' }}
                  PEERBIT_SCALEWAY_SSH_PUBLIC_KEY: ${{ secrets.PEERBIT_SCALEWAY_SSH_PUBLIC_KEY }}
                  PEERBIT_SCALEWAY_SSH_IDENTITY_FILE: ${{ runner.temp }}/scaleway_ssh
                  PEERBIT_RUNNER_EPHEMERAL: "1"
                  PEERBIT_SCALEWAY_ENABLE_KEXT: "1"
                  PEERBIT_SCALEWAY_REUSE_SERVER: "1"
                  PEERBIT_SCALEWAY_REUSE_POOL: shared-fs
                  PEERBIT_RUNNER_REPLACE: "1"
                  PEERBIT_RUNNER_LABELS: peerbit,scaleway,shared-fs-native,${{ steps.labels.outputs.unique_label }}
              run: node scripts/github-scaleway-runner.mjs start

            - name: Preserve runner state
              if: always()
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
              with:
                  name: scaleway-macos-state-${{ github.run_id }}-${{ github.run_attempt }}
                  path: tmp/processes/github-scaleway-runner.json
                  if-no-files-found: warn
                  retention-days: 2

    macos-native-smoke:
        name: macOS macFUSE native smoke (Scaleway)
        needs: provision-macos
        runs-on: ${{ fromJSON(needs.provision-macos.outputs.runs_on) }}
        timeout-minutes: 45
        steps:
            - name: Checkout
              uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

            - name: Setup pnpm
              uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
              with:
                  run_install: false

            - name: Setup Node
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
              with:
                  node-version: 22
                  cache: pnpm
                  cache-dependency-path: pnpm-lock.yaml

            - name: Setup Go
              uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
              with:
                  go-version: "1.24.x"
                  cache: false

            - name: Check macFUSE
              shell: bash
              run: scripts/shared-fs-check-macfuse.sh

            - name: Install dependencies
              run: PEERBIT_SKIP_ROOT_POSTINSTALL=1 pnpm install --frozen-lockfile --prod --filter @peerbit/shared-fs... --filter @peerbit/shared-fs-cli...

            - name: Build shared-fs packages
              run: node scripts/shared-fs-build-packages.mjs

            - name: Run external native adapter smoke
              shell: bash
              env:
                  PEERBIT_SHARED_FS_NATIVE_MOUNT_BENCH_OUTPUT: ${{ inputs.mounted_benchmark && format('{0}/shared-fs-macos-macfuse-benchmark.json', runner.temp) || '' }}
                  PEERBIT_SHARED_FS_NATIVE_CONTROL_BENCH_OUTPUT: ${{ inputs.mounted_benchmark && format('{0}/shared-fs-macos-control-benchmark.json', runner.temp) || '' }}
              run: scripts/shared-fs-external-native-smoke.sh

            - name: Add filesystem benchmark summaries
              if: ${{ always() && inputs.mounted_benchmark }}
              shell: bash
              env:
                  MOUNT_BENCHMARK_REPORT: ${{ runner.temp }}/shared-fs-macos-macfuse-benchmark.json
                  CONTROL_BENCHMARK_REPORT: ${{ runner.temp }}/shared-fs-macos-control-benchmark.json
              run: |
                  for report in "$MOUNT_BENCHMARK_REPORT" "$CONTROL_BENCHMARK_REPORT"; do
                    if [ ! -f "$report" ]; then
                      echo "## Shared FS filesystem-path benchmark" >> "$GITHUB_STEP_SUMMARY"
                      echo >> "$GITHUB_STEP_SUMMARY"
                      echo "A requested macOS benchmark report was not produced: $report" >> "$GITHUB_STEP_SUMMARY"
                      exit 1
                    fi
                  done
                  node --input-type=module -e '
                    import { appendFile, readFile } from "node:fs/promises";
                    import { formatNativeMountBenchmarkSummary, validateNativeMountBenchmarkReport } from "./scripts/shared-fs-native-mount-benchmark.mjs";
                    for (const path of [process.env.MOUNT_BENCHMARK_REPORT, process.env.CONTROL_BENCHMARK_REPORT]) {
                      const report = JSON.parse(await readFile(path, "utf8"));
                      validateNativeMountBenchmarkReport(report);
                      await appendFile(process.env.GITHUB_STEP_SUMMARY, formatNativeMountBenchmarkSummary(report));
                    }
                  '

            - name: Upload filesystem benchmark reports
              if: ${{ always() && inputs.mounted_benchmark }}
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
              with:
                  name: shared-fs-macos-benchmarks-${{ github.run_id }}-${{ github.run_attempt }}
                  path: |
                      ${{ runner.temp }}/shared-fs-macos-macfuse-benchmark.json
                      ${{ runner.temp }}/shared-fs-macos-control-benchmark.json
                  if-no-files-found: error
                  retention-days: 14

    cleanup-macos:
        name: Cleanup macOS runner
        if: ${{ always() && needs.provision-macos.result != 'skipped' }}
        needs:
            - provision-macos
            - macos-native-smoke
        runs-on: ubuntu-latest
        timeout-minutes: 20
        steps:
            - name: Checkout
              uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

            - name: Restore runner state
              uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
              continue-on-error: true
              with:
                  name: scaleway-macos-state-${{ github.run_id }}-${{ github.run_attempt }}
                  path: tmp/processes

            - name: Stop runner
              shell: bash
              env:
                  GH_TOKEN: ${{ secrets.PEERBIT_RUNNER_ADMIN_TOKEN }}
                  ACCESS_KEY_ID: ${{ secrets.SCALEWAY_ACCESS_KEY_ID }}
                  SECRET_ACCESS_KEY: ${{ secrets.SCALEWAY_SECRET_ACCESS_KEY }}
                  SCALEWAY_PROJECT_ID: ${{ secrets.SCALEWAY_PROJECT_ID }}
                  PEERBIT_FORCE: "1"
              run: |
                  set -euo pipefail
                  if [ ! -f tmp/processes/github-scaleway-runner.json ]; then
                    echo "No macOS runner state artifact found."
                    exit 0
                  fi
                  node scripts/github-scaleway-runner.mjs stop

    resource-sanity:
        name: Check Scaleway resource cleanup
        if: ${{ always() && (github.event_name == 'schedule' || github.event.inputs.operation != 'janitor') }}
        needs:
            - janitor
            - cleanup-macos
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - name: Checkout
              uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

            - name: Check native runner resource limits
              shell: bash
              env:
                  SECRET_ACCESS_KEY: ${{ secrets.SCALEWAY_SECRET_ACCESS_KEY }}
              run: |
                  set -euo pipefail
                  node scripts/shared-fs-scaleway-resource-check.mjs \
                    --repo "${GITHUB_REPOSITORY##*/}" \
                    --mac-max 1 \
                    --windows-max 1 \
                    --skip-missing-credentials
