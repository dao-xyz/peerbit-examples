name: Shared FS Native Smoke

on:
    workflow_dispatch:
        inputs:
            mounted_benchmark:
                description: Collect report-only mounted and local-control filesystem benchmarks.
                required: true
                default: false
                type: boolean

permissions:
    contents: read

env:
    FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
    linux-fuse:
        name: Linux FUSE native smoke
        runs-on: ubuntu-latest
        timeout-minutes: 30

        steps:
            - name: Checkout
              uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

            - name: Setup pnpm
              uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
              with:
                  run_install: false

            - name: Setup Node
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
              with:
                  node-version: 22
                  cache: pnpm
                  cache-dependency-path: pnpm-lock.yaml

            - name: Setup Go
              uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
              with:
                  go-version: "1.24.x"
                  cache-dependency-path: packages/shared-fs/native/go.sum

            - name: Install FUSE
              run: |
                  sudo apt-get update
                  sudo apt-get install -y fuse3 libfuse3-dev
                  sudo apt-get install -y libfuse2t64 || sudo apt-get install -y libfuse2
                  sudo modprobe fuse || true
                  if test -e /dev/fuse; then
                    sudo chmod 666 /dev/fuse
                  fi

            - name: Install dependencies
              run: pnpm install --frozen-lockfile --filter @peerbit/shared-fs... --filter @peerbit/shared-fs-cli...

            - name: Build shared-fs packages
              run: pnpm -r --sort --filter @peerbit/shared-fs --filter @peerbit/shared-fs-cli run build

            - name: Install optional native adapter
              run: |
                  native_deps="$RUNNER_TEMP/fuse-native-deps"
                  npm install --prefix "$native_deps" --no-save --package-lock=false fuse-native@2.2.6
                  mkdir -p packages/shared-fs/library/node_modules
                  rm -rf packages/shared-fs/library/node_modules/fuse-native
                  ln -s "$native_deps/node_modules/fuse-native" packages/shared-fs/library/node_modules/fuse-native

            - name: Verify optional native adapter import
              working-directory: packages/shared-fs/library
              run: |
                  node -e "import('fuse-native').then(() => console.log('fuse-native import ok')).catch((error) => { console.error(error); process.exit(1); })"

            - name: Run native mount smoke
              env:
                  PEERBIT_SHARED_FS_NATIVE_SMOKE: "1"
              run: pnpm --filter @peerbit/shared-fs exec vitest run src/__tests__/native-mount.smoke.test.ts

            - name: Run external native adapter smoke
              shell: bash
              env:
                  PEERBIT_SHARED_FS_NATIVE_MOUNT_BENCH_OUTPUT: ${{ inputs.mounted_benchmark && format('{0}/shared-fs-linux-fuse-benchmark.json', runner.temp) || '' }}
                  PEERBIT_SHARED_FS_NATIVE_CONTROL_BENCH_OUTPUT: ${{ inputs.mounted_benchmark && format('{0}/shared-fs-linux-control-benchmark.json', runner.temp) || '' }}
              run: scripts/shared-fs-external-native-smoke.sh

            - name: Add filesystem benchmark summaries
              if: ${{ always() && inputs.mounted_benchmark }}
              shell: bash
              env:
                  MOUNT_BENCHMARK_REPORT: ${{ runner.temp }}/shared-fs-linux-fuse-benchmark.json
                  CONTROL_BENCHMARK_REPORT: ${{ runner.temp }}/shared-fs-linux-control-benchmark.json
              run: |
                  for report in "$MOUNT_BENCHMARK_REPORT" "$CONTROL_BENCHMARK_REPORT"; do
                    if [ ! -f "$report" ]; then
                      echo "## Shared FS filesystem-path benchmark" >> "$GITHUB_STEP_SUMMARY"
                      echo >> "$GITHUB_STEP_SUMMARY"
                      echo "A requested benchmark report was not produced: $report" >> "$GITHUB_STEP_SUMMARY"
                      exit 1
                    fi
                  done
                  node --input-type=module -e '
                    import { appendFile, readFile } from "node:fs/promises";
                    import { formatNativeMountBenchmarkSummary, validateNativeMountBenchmarkReport } from "./scripts/shared-fs-native-mount-benchmark.mjs";
                    for (const path of [process.env.MOUNT_BENCHMARK_REPORT, process.env.CONTROL_BENCHMARK_REPORT]) {
                      const report = JSON.parse(await readFile(path, "utf8"));
                      validateNativeMountBenchmarkReport(report);
                      await appendFile(process.env.GITHUB_STEP_SUMMARY, formatNativeMountBenchmarkSummary(report));
                    }
                  '

            - name: Upload filesystem benchmark reports
              if: ${{ always() && inputs.mounted_benchmark }}
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
              with:
                  name: shared-fs-linux-benchmarks-${{ github.run_id }}-${{ github.run_attempt }}
                  path: |
                      ${{ runner.temp }}/shared-fs-linux-fuse-benchmark.json
                      ${{ runner.temp }}/shared-fs-linux-control-benchmark.json
                  if-no-files-found: error
                  retention-days: 14
