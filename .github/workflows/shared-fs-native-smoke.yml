name: Shared FS Native Smoke

# Real kernel mounts on GitHub-hosted runners: Linux FUSE (fuse3) and Windows
# WinFsp. Pull requests and pushes run the smoke only; the benchmarks are
# opt-in on manual runs. macFUSE needs an approved kernel extension, which
# hosted runners cannot load; see Shared FS Native OS Smoke.
on:
    pull_request:
        paths:
            - ".github/workflows/shared-fs-native-smoke.yml"
            - "package.json"
            - "pnpm-lock.yaml"
            - "packages/shared-fs/**"
            - "scripts/shared-fs-external-native-smoke.ps1"
            - "scripts/shared-fs-external-native-smoke.sh"
            - "scripts/shared-fs-native-mount-benchmark*.mjs"
    push:
        branches: [master]
        paths:
            - ".github/workflows/shared-fs-native-smoke.yml"
            - "package.json"
            - "pnpm-lock.yaml"
            - "packages/shared-fs/**"
            - "scripts/shared-fs-external-native-smoke.ps1"
            - "scripts/shared-fs-external-native-smoke.sh"
            - "scripts/shared-fs-native-mount-benchmark*.mjs"
    workflow_dispatch:
        inputs:
            mounted_benchmark:
                description: Collect report-only mounted and local-control filesystem benchmarks.
                required: true
                default: false
                type: boolean
            mount_profile:
                description: Also run alternating unprofiled/profiled mounted benchmark passes (A-B-B-A) on Linux and publish the mount profile summary.
                required: false
                default: false
                type: boolean
            overwrite_base_bytes:
                description: Base file size(s) for the mounted 4 KiB in-place overwrite scenario; a comma-separated pair runs both.
                required: false
                default: "4194304"
                type: choice
                options:
                    - "4194304"
                    - "33554432"
                    - "4194304,33554432"
            dev_workload:
                description: Also run the report-only developer-machine workload (git clone and status of a synthetic 2,000-file repo, editor saves, JSONL appends, SQLite transactions) on the mount and the local control. Implies the mounted benchmark.
                required: false
                default: false
                type: boolean

permissions:
    contents: read

env:
    FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
    linux-fuse:
        name: Linux FUSE native smoke
        runs-on: ubuntu-latest
        # Four extra mounted benchmark passes need more time than the smoke,
        # and the developer workload adds a git clone/status set to each pass.
        timeout-minutes: ${{ inputs.mount_profile && (inputs.dev_workload && 180 || 120) || (inputs.dev_workload && 60 || 30) }}

        steps:
            - name: Checkout
              uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

            - name: Setup pnpm
              uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
              with:
                  run_install: false

            - name: Setup Node
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
              with:
                  node-version: 22
                  cache: pnpm
                  cache-dependency-path: pnpm-lock.yaml

            - name: Setup Go
              uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
              with:
                  go-version: "1.24.x"
                  cache-dependency-path: packages/shared-fs/native/go.sum

            - name: Install FUSE
              run: |
                  sudo apt-get update
                  sudo apt-get install -y fuse3 libfuse3-dev
                  sudo apt-get install -y libfuse2t64 || sudo apt-get install -y libfuse2
                  sudo modprobe fuse || true
                  if test -e /dev/fuse; then
                    sudo chmod 666 /dev/fuse
                  fi

            - name: Install dependencies
              run: pnpm install --frozen-lockfile --filter @peerbit/shared-fs... --filter @peerbit/shared-fs-cli...

            - name: Build shared-fs packages
              run: pnpm -r --sort --filter @peerbit/shared-fs --filter @peerbit/shared-fs-cli run build

            - name: Run external native adapter smoke
              shell: bash
              env:
                  PEERBIT_SHARED_FS_NATIVE_MOUNT_BENCH_OUTPUT: ${{ (inputs.mounted_benchmark || inputs.dev_workload) && format('{0}/shared-fs-linux-fuse-benchmark.json', runner.temp) || '' }}
                  PEERBIT_SHARED_FS_NATIVE_CONTROL_BENCH_OUTPUT: ${{ (inputs.mounted_benchmark || inputs.dev_workload) && format('{0}/shared-fs-linux-control-benchmark.json', runner.temp) || '' }}
                  PEERBIT_SHARED_FS_NATIVE_MOUNT_BENCH_OVERWRITE_BASE_BYTES: ${{ inputs.overwrite_base_bytes }}
                  PEERBIT_SHARED_FS_NATIVE_MOUNT_BENCH_DEV_WORKLOAD: ${{ inputs.dev_workload && '1' || '' }}
              run: scripts/shared-fs-external-native-smoke.sh

            - name: Add filesystem benchmark summaries
              if: ${{ always() && (inputs.mounted_benchmark || inputs.dev_workload) }}
              shell: bash
              env:
                  MOUNT_BENCHMARK_REPORT: ${{ runner.temp }}/shared-fs-linux-fuse-benchmark.json
                  CONTROL_BENCHMARK_REPORT: ${{ runner.temp }}/shared-fs-linux-control-benchmark.json
              run: |
                  for report in "$MOUNT_BENCHMARK_REPORT" "$CONTROL_BENCHMARK_REPORT"; do
                    if [ ! -f "$report" ]; then
                      echo "## Shared FS filesystem-path benchmark" >> "$GITHUB_STEP_SUMMARY"
                      echo >> "$GITHUB_STEP_SUMMARY"
                      echo "A requested benchmark report was not produced: $report" >> "$GITHUB_STEP_SUMMARY"
                      exit 1
                    fi
                  done
                  node --input-type=module -e '
                    import { appendFile, readFile } from "node:fs/promises";
                    import { formatNativeMountBenchmarkComparison, formatNativeMountBenchmarkSummary, validateNativeMountBenchmarkReport } from "./scripts/shared-fs-native-mount-benchmark.mjs";
                    const reports = [];
                    for (const path of [process.env.MOUNT_BENCHMARK_REPORT, process.env.CONTROL_BENCHMARK_REPORT]) {
                      const report = JSON.parse(await readFile(path, "utf8"));
                      validateNativeMountBenchmarkReport(report);
                      reports.push(report);
                      await appendFile(process.env.GITHUB_STEP_SUMMARY, formatNativeMountBenchmarkSummary(report));
                    }
                    if (reports[0].run.devWorkload) {
                      await appendFile(process.env.GITHUB_STEP_SUMMARY, formatNativeMountBenchmarkComparison(reports[0], reports[1]));
                    }
                  '

            - name: Upload filesystem benchmark reports
              if: ${{ always() && (inputs.mounted_benchmark || inputs.dev_workload) }}
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
              with:
                  name: shared-fs-linux-benchmarks-${{ github.run_id }}-${{ github.run_attempt }}
                  path: |
                      ${{ runner.temp }}/shared-fs-linux-fuse-benchmark.json
                      ${{ runner.temp }}/shared-fs-linux-control-benchmark.json
                  if-no-files-found: error
                  retention-days: 14

            # Opt-in mount profiling. Unprofiled (A) and profiled (B) passes
            # alternate A-B-B-A on this one VM so profiling overhead and drift
            # are visible next to the profile itself.
            - name: Run alternating unprofiled and profiled mounted benchmark passes
              if: ${{ inputs.mount_profile }}
              shell: bash
              env:
                  PROFILE_ROOT: ${{ runner.temp }}/shared-fs-mount-profile
                  PEERBIT_SHARED_FS_NATIVE_MOUNT_BENCH_OVERWRITE_BASE_BYTES: ${{ inputs.overwrite_base_bytes }}
                  PEERBIT_SHARED_FS_NATIVE_MOUNT_BENCH_DEV_WORKLOAD: ${{ inputs.dev_workload && '1' || '' }}
              run: |
                  set -euo pipefail
                  rm -rf "$PROFILE_ROOT"
                  mkdir -p "$PROFILE_ROOT"
                  for pass in A1:unprofiled B1:profiled B2:profiled A2:unprofiled; do
                    label="${pass%%:*}"
                    mode="${pass##*:}"
                    echo "::group::Mounted benchmark pass $label ($mode)"
                    if [ "$mode" = "profiled" ]; then
                      PEERBIT_SHARED_FS_NATIVE_MOUNT_PROFILE_DIR="$PROFILE_ROOT/$label-profile" \
                        PEERBIT_SHARED_FS_NATIVE_MOUNT_BENCH_OUTPUT="$PROFILE_ROOT/$label-benchmark.json" \
                        scripts/shared-fs-external-native-smoke.sh
                    else
                      PEERBIT_SHARED_FS_NATIVE_MOUNT_BENCH_OUTPUT="$PROFILE_ROOT/$label-benchmark.json" \
                        scripts/shared-fs-external-native-smoke.sh
                    fi
                    echo "::endgroup::"
                  done

            - name: Summarize mount profile
              if: ${{ always() && inputs.mount_profile }}
              shell: bash
              env:
                  PROFILE_ROOT: ${{ runner.temp }}/shared-fs-mount-profile
                  STEP_SUMMARY_LIMIT_BYTES: "65536"
              run: |
                  set -euo pipefail
                  mkdir -p "$PROFILE_ROOT"
                  for label in B1 B2; do
                    if [ ! -d "$PROFILE_ROOT/$label-profile" ]; then
                      continue
                    fi
                    args=(--profile-dir "$PROFILE_ROOT/$label-profile")
                    if [ -f "$PROFILE_ROOT/$label-benchmark.json" ]; then
                      args+=(--benchmark "$label=$PROFILE_ROOT/$label-benchmark.json")
                    fi
                    node scripts/shared-fs-mount-profile-summary.mjs "${args[@]}" \
                      --title "Shared FS mount profile: pass $label (profiled)" \
                      --json "$PROFILE_ROOT/$label-summary.json" \
                      --markdown "$PROFILE_ROOT/$label-summary.md" >/dev/null
                  done
                  ab=()
                  for pass in A1:unprofiled B1:profiled B2:profiled A2:unprofiled; do
                    report="$PROFILE_ROOT/${pass%%:*}-benchmark.json"
                    if [ -f "$report" ]; then
                      ab+=(--ab-report "$pass=$report")
                    fi
                  done
                  if [ "${#ab[@]}" -gt 0 ]; then
                    node scripts/shared-fs-mount-profile-summary.mjs "${ab[@]}" \
                      --markdown "$PROFILE_ROOT/overhead.md" >/dev/null
                  fi
                  summary="$PROFILE_ROOT/step-summary.md"
                  : > "$summary"
                  for part in overhead B1-summary B2-summary; do
                    if [ -f "$PROFILE_ROOT/$part.md" ]; then
                      cat "$PROFILE_ROOT/$part.md" >> "$summary"
                    fi
                  done
                  if [ ! -s "$summary" ]; then
                    echo "## Shared FS mount profile" >> "$GITHUB_STEP_SUMMARY"
                    echo >> "$GITHUB_STEP_SUMMARY"
                    echo "No mount profile or benchmark pass was produced." >> "$GITHUB_STEP_SUMMARY"
                    exit 1
                  fi
                  if [ "$(wc -c < "$summary")" -gt "$STEP_SUMMARY_LIMIT_BYTES" ]; then
                    head -c "$STEP_SUMMARY_LIMIT_BYTES" "$summary" >> "$GITHUB_STEP_SUMMARY"
                    printf '\n\n(Step summary truncated at %s bytes; see the uploaded artifact.)\n' "$STEP_SUMMARY_LIMIT_BYTES" >> "$GITHUB_STEP_SUMMARY"
                  else
                    cat "$summary" >> "$GITHUB_STEP_SUMMARY"
                  fi

            - name: Upload mount profile
              if: ${{ always() && inputs.mount_profile }}
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
              with:
                  name: shared-fs-linux-mount-profile-${{ github.run_id }}-${{ github.run_attempt }}
                  path: ${{ runner.temp }}/shared-fs-mount-profile
                  if-no-files-found: error
                  retention-days: 14

    windows-winfsp:
        name: Windows WinFsp native smoke (${{ matrix.os }})
        runs-on: ${{ matrix.os }}
        timeout-minutes: ${{ inputs.dev_workload && 120 || (inputs.mounted_benchmark && 60 || 30) }}
        strategy:
            fail-fast: false
            matrix:
                os:
                    - windows-2025
                    - windows-2022

        steps:
            - name: Checkout
              uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

            - name: Setup pnpm
              uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
              with:
                  run_install: false

            - name: Setup Node
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
              with:
                  node-version: 22
                  cache: pnpm
                  cache-dependency-path: pnpm-lock.yaml

            - name: Setup Go
              uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
              with:
                  go-version: "1.24.x"
                  cache-dependency-path: packages/shared-fs/native/go.sum

            - name: Use Bash for pnpm scripts
              run: pnpm config set script-shell "C:\Program Files\Git\bin\bash.exe"

            - name: Install WinFsp
              shell: powershell
              run: |
                  choco install winfsp -y --no-progress --version=2.1.25156
                  $WinFspDll = @(
                    "C:\Program Files\WinFsp\bin\winfsp-x64.dll",
                    "C:\Program Files (x86)\WinFsp\bin\winfsp-x64.dll"
                  ) | Where-Object { Test-Path $_ } | Select-Object -First 1
                  if (-not $WinFspDll) {
                    throw "WinFsp is not installed."
                  }
                  Split-Path -Parent $WinFspDll | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

            - name: Install dependencies
              run: pnpm install --frozen-lockfile --filter @peerbit/shared-fs... --filter @peerbit/shared-fs-cli...

            - name: Build shared-fs packages
              run: pnpm -r --sort --filter @peerbit/shared-fs --filter @peerbit/shared-fs-cli run build

            - name: Run external native adapter smoke
              shell: powershell
              env:
                  PEERBIT_SHARED_FS_NATIVE_MOUNT_BENCH_OUTPUT: ${{ (inputs.mounted_benchmark || inputs.dev_workload) && format('{0}/shared-fs-{1}-winfsp-mount-benchmark.json', runner.temp, matrix.os) || '' }}
                  PEERBIT_SHARED_FS_NATIVE_CONTROL_BENCH_OUTPUT: ${{ (inputs.mounted_benchmark || inputs.dev_workload) && format('{0}/shared-fs-{1}-winfsp-control-benchmark.json', runner.temp, matrix.os) || '' }}
                  PEERBIT_SHARED_FS_NATIVE_MOUNT_BENCH_OVERWRITE_BASE_BYTES: ${{ inputs.overwrite_base_bytes }}
                  PEERBIT_SHARED_FS_NATIVE_MOUNT_BENCH_DEV_WORKLOAD: ${{ inputs.dev_workload && '1' || '' }}
                  # Adapter debug output is printed only when the smoke fails.
                  PEERBIT_SHARED_FS_NATIVE_ADAPTER_DEBUG: ${{ (inputs.mounted_benchmark || inputs.dev_workload) && '0' || '1' }}
              run: scripts/shared-fs-external-native-smoke.ps1

            - name: Add filesystem benchmark summaries
              if: ${{ always() && (inputs.mounted_benchmark || inputs.dev_workload) }}
              shell: bash
              env:
                  MOUNT_BENCHMARK_REPORT: ${{ runner.temp }}/shared-fs-${{ matrix.os }}-winfsp-mount-benchmark.json
                  CONTROL_BENCHMARK_REPORT: ${{ runner.temp }}/shared-fs-${{ matrix.os }}-winfsp-control-benchmark.json
              run: |
                  for report in "$MOUNT_BENCHMARK_REPORT" "$CONTROL_BENCHMARK_REPORT"; do
                    if [ ! -f "$report" ]; then
                      echo "## Shared FS filesystem-path benchmark" >> "$GITHUB_STEP_SUMMARY"
                      echo >> "$GITHUB_STEP_SUMMARY"
                      echo "A requested benchmark report was not produced: $report" >> "$GITHUB_STEP_SUMMARY"
                      exit 1
                    fi
                  done
                  node --input-type=module -e '
                    import { appendFile, readFile } from "node:fs/promises";
                    import { formatNativeMountBenchmarkComparison, formatNativeMountBenchmarkSummary, validateNativeMountBenchmarkReport } from "./scripts/shared-fs-native-mount-benchmark.mjs";
                    const reports = [];
                    for (const path of [process.env.MOUNT_BENCHMARK_REPORT, process.env.CONTROL_BENCHMARK_REPORT]) {
                      const report = JSON.parse(await readFile(path, "utf8"));
                      validateNativeMountBenchmarkReport(report);
                      reports.push(report);
                      await appendFile(process.env.GITHUB_STEP_SUMMARY, formatNativeMountBenchmarkSummary(report));
                    }
                    if (reports[0].run.devWorkload) {
                      await appendFile(process.env.GITHUB_STEP_SUMMARY, formatNativeMountBenchmarkComparison(reports[0], reports[1]));
                    }
                  '

            - name: Upload filesystem benchmark reports
              if: ${{ always() && (inputs.mounted_benchmark || inputs.dev_workload) }}
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
              with:
                  name: shared-fs-${{ matrix.os }}-winfsp-benchmarks-${{ github.run_id }}-${{ github.run_attempt }}
                  path: |
                      ${{ runner.temp }}/shared-fs-${{ matrix.os }}-winfsp-mount-benchmark.json
                      ${{ runner.temp }}/shared-fs-${{ matrix.os }}-winfsp-control-benchmark.json
                  if-no-files-found: error
                  retention-days: 14
