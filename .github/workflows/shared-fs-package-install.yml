name: Shared FS Package Install

on:
    pull_request:
        paths:
            - ".github/workflows/shared-fs-package-install.yml"
            - "LICENSE"
            - "package.json"
            - "pnpm-lock.yaml"
            - "scripts/verify-shared-fs-package-contents.mjs"
            - "scripts/lf-normalized-size.mjs"
            - "scripts/lf-normalized-size.test.mjs"
            - "scripts/compact-emitted-javascript.mjs"
            - "scripts/compact-emitted-javascript.test.mjs"
            - "tsconfig.json"
            - "packages/shared-fs/**"
    push:
        branches: [master]
        paths:
            - ".github/workflows/shared-fs-package-install.yml"
            - "LICENSE"
            - "package.json"
            - "pnpm-lock.yaml"
            - "scripts/verify-shared-fs-package-contents.mjs"
            - "scripts/lf-normalized-size.mjs"
            - "scripts/lf-normalized-size.test.mjs"
            - "scripts/compact-emitted-javascript.mjs"
            - "scripts/compact-emitted-javascript.test.mjs"
            - "tsconfig.json"
            - "packages/shared-fs/**"
    workflow_dispatch:

permissions:
    contents: read

env:
    FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
    tarball-install:
        name: Tarball install (${{ matrix.os }})
        runs-on: ${{ matrix.os }}
        timeout-minutes: 30
        strategy:
            fail-fast: false
            matrix:
                os:
                    - ubuntu-latest
                    - macos-latest
                    - windows-2025

        steps:
            - name: Checkout
              uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

            - name: Setup pnpm
              uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
              with:
                  run_install: false

            - name: Setup Node
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
              with:
                  node-version: 22
                  cache: pnpm
                  cache-dependency-path: pnpm-lock.yaml

            - name: Use Bash for pnpm scripts on Windows
              if: runner.os == 'Windows'
              run: pnpm config set script-shell "C:\\Program Files\\Git\\bin\\bash.exe"

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Build shared-fs packages
              run: pnpm -r --sort --filter @peerbit/shared-fs --filter @peerbit/shared-fs-cli run build

            - name: Test emitted-JavaScript compaction
              run: pnpm run test:shared-fs-build-output

            - name: Test LF-normalized package sizes
              run: node --test scripts/lf-normalized-size.test.mjs

            - name: Verify package contents and size budgets
              run: node scripts/verify-shared-fs-package-contents.mjs

            - name: Pack packages
              shell: bash
              run: |
                  set -euo pipefail
                  pack_dir="$RUNNER_TEMP/shared-fs-packs"
                  mkdir -p "$pack_dir"
                  pnpm --filter @peerbit/shared-fs pack --pack-destination "$pack_dir"
                  pnpm --filter @peerbit/shared-fs-cli pack --pack-destination "$pack_dir"
                  ls -l "$pack_dir"

            - name: Install packed packages in clean project
              shell: bash
              run: |
                  set -euo pipefail
                  pack_dir="$RUNNER_TEMP/shared-fs-packs"
                  project_dir="$RUNNER_TEMP/shared-fs-install-smoke"
                  mkdir -p "$project_dir"
                  cd "$project_dir"
                  npm init -y
                  shared_fs_tgz="$(find "$pack_dir" -maxdepth 1 -name 'peerbit-shared-fs-[0-9]*.tgz' | head -n 1)"
                  cli_tgz="$(find "$pack_dir" -maxdepth 1 -name 'peerbit-shared-fs-cli-*.tgz' | head -n 1)"
                  test -n "$shared_fs_tgz"
                  test -n "$cli_tgz"
                  npm install --ignore-scripts --omit=peer "$shared_fs_tgz" "$cli_tgz"
                  node -e "import('@peerbit/shared-fs').then((m) => { if (typeof m.openSharedFs !== 'function') throw new Error('openSharedFs export missing'); })"
                  node node_modules/@peerbit/shared-fs-cli/lib/esm/bin.js --help >/dev/null

            - name: Install released native adapter
              shell: bash
              run: |
                  set -euo pipefail
                  project_dir="$RUNNER_TEMP/shared-fs-install-smoke"
                  adapter_dir="$RUNNER_TEMP/shared-fs-native-adapter"
                  cd "$project_dir"
                  # Release makes a version's adapter assets downloadable before it
                  # publishes that version to npm. Until npm lists the packed CLI's
                  # version (a version PR, or master while a release is in flight),
                  # its assets may not exist yet, so validate the installer against
                  # npm's latest release instead. Release's pack-install smoke and
                  # the Published NPM Smoke install the new version's own adapter.
                  cli_version="$(node -p 'require("./node_modules/@peerbit/shared-fs-cli/package.json").version')"
                  published_versions="$(npm view @peerbit/shared-fs-cli versions --json)"
                  cli_published="$(node -e 'const [version, list] = process.argv.slice(1); console.log([].concat(JSON.parse(list)).includes(version) ? "yes" : "no")' "$cli_version" "$published_versions")"
                  if [ "$cli_published" = "no" ]; then
                    published_adapter_version="$(npm view @peerbit/shared-fs-cli version)"
                    test -n "$published_adapter_version"
                    export SHARED_FS_NATIVE_ADAPTER_VERSION="$published_adapter_version"
                    echo "@peerbit/shared-fs-cli ${cli_version} is not on npm yet: validating native adapter ${published_adapter_version}"
                  fi
                  adapter_path="$(bash "$GITHUB_WORKSPACE/scripts/shared-fs-install-adapter-with-retry.sh" "$adapter_dir" node node_modules/@peerbit/shared-fs-cli/lib/esm/bin.js)"
                  test -f "$adapter_path"
                  if [ "$RUNNER_OS" != "Windows" ]; then
                    test -x "$adapter_path"
                  fi
                  echo "installed adapter: $adapter_path"
