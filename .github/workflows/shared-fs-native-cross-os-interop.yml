name: Shared FS Native Cross-OS Interop

# Real kernel mounts on GitHub-hosted runners joining one shared filesystem:
# a Linux fuse3 seed and WinFsp joiners on Windows Server 2025 and 2022. Each
# peer writes, renames and acknowledges files through its own mount and waits
# for every other peer's. Hosted runners accept no inbound connections, so the
# peers reach each other through the public Peerbit bootstrap relay
# (bootstrap-5.env). A macOS join needs macFUSE, which hosted runners cannot
# load; Shared FS Cross-OS Interop covers macOS at the library level.
on:
    workflow_dispatch:
        inputs:
            timeout_minutes:
                description: "How long each native mount waits for the other peers' files"
                required: true
                type: number
                default: 35
            join_platforms:
                description: "Windows runner(s) that join the Linux seed"
                required: true
                type: choice
                default: all
                options:
                    - all
                    - windows-2025
                    - windows-2022

permissions:
    actions: read
    contents: read

env:
    NATIVE_INTEROP_TIMEOUT_MINUTES: ${{ github.event.inputs.timeout_minutes || '35' }}
    FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
    plan:
        name: Plan native joiners
        runs-on: ubuntu-latest
        outputs:
            joiners: ${{ steps.plan.outputs.joiners }}
            expected_joiners: ${{ steps.plan.outputs.expected_joiners }}
        steps:
            - name: Compute join plan
              id: plan
              shell: bash
              run: |
                  set -euo pipefail
                  join_platforms="${{ github.event.inputs.join_platforms || 'all' }}"
                  case "$join_platforms" in
                    all) expected_joiners="windows-2025,windows-2022" ;;
                    windows-2025 | windows-2022) expected_joiners="$join_platforms" ;;
                    *)
                      echo "Unsupported join_platforms: $join_platforms" >&2
                      exit 2
                      ;;
                  esac
                  joiners="$(node -e 'console.log(JSON.stringify(process.argv[1].split(",")))' "$expected_joiners")"
                  echo "joiners=$joiners" >> "$GITHUB_OUTPUT"
                  echo "expected_joiners=$expected_joiners" >> "$GITHUB_OUTPUT"
                  echo "expected_joiners=$expected_joiners"

    seed-linux-native:
        name: Linux FUSE native seed
        needs: plan
        runs-on: ubuntu-latest
        timeout-minutes: 60
        steps:
            - name: Checkout
              uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

            - name: Setup pnpm
              uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
              with:
                  run_install: false

            - name: Setup Node
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
              with:
                  node-version: 22
                  cache: pnpm
                  cache-dependency-path: pnpm-lock.yaml

            - name: Setup Go
              uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
              with:
                  go-version: "1.24.x"
                  cache-dependency-path: packages/shared-fs/native/go.sum

            - name: Install FUSE
              run: |
                  sudo apt-get update
                  sudo apt-get install -y fuse3 libfuse3-dev
                  sudo apt-get install -y libfuse2t64 || sudo apt-get install -y libfuse2
                  sudo modprobe fuse || true
                  sudo chmod 666 /dev/fuse || true

            - name: Install dependencies
              shell: bash
              run: |
                  set -euo pipefail
                  mkdir -p native-interop-metrics
                  started_ms="$(node -e 'process.stdout.write(String(Date.now()))')"
                  set +e
                  PEERBIT_SKIP_ROOT_POSTINSTALL=1 pnpm install --frozen-lockfile --prod --filter @peerbit/shared-fs... --filter @peerbit/shared-fs-cli...
                  status="$?"
                  set -e
                  ended_ms="$(node -e 'process.stdout.write(String(Date.now()))')"
                  node scripts/shared-fs-native-interop-metrics.mjs phase \
                    native-interop-metrics/linux-workflow.json \
                    linux workflow installDependencies "$started_ms" "$ended_ms" "$status"
                  exit "$status"

            - name: Build shared-fs packages
              shell: bash
              run: |
                  set -euo pipefail
                  mkdir -p native-interop-metrics
                  started_ms="$(node -e 'process.stdout.write(String(Date.now()))')"
                  set +e
                  node scripts/shared-fs-build-packages.mjs
                  status="$?"
                  set -e
                  ended_ms="$(node -e 'process.stdout.write(String(Date.now()))')"
                  node scripts/shared-fs-native-interop-metrics.mjs phase \
                    native-interop-metrics/linux-workflow.json \
                    linux workflow buildSharedFs "$started_ms" "$ended_ms" "$status"
                  exit "$status"

            - name: Start Linux native seed mount
              shell: bash
              run: |
                  set -euo pipefail
                  mkdir -p shared-fs-native-address native-interop-logs
                  timeout_seconds=$((NATIVE_INTEROP_TIMEOUT_MINUTES * 60))
                  (
                    set +e
                    bash scripts/shared-fs-native-cross-os-interop.sh \
                      --role seed \
                      --machine linux \
                      --expected "${{ needs.plan.outputs.expected_joiners }}" \
                      --expected-acks "${{ needs.plan.outputs.expected_joiners }}" \
                      --address-file shared-fs-native-address/address.txt \
                      --metrics-file native-interop-metrics/linux.json \
                      --timeout-seconds "$timeout_seconds" \
                      > native-interop-logs/linux-seed.log 2>&1
                    status="$?"
                    echo "$status" > native-interop-logs/linux-seed.exit
                    exit "$status"
                  ) &
                  echo "$!" > native-interop-logs/linux-seed.pid

                  for _ in {1..120}; do
                    if test -s shared-fs-native-address/address.txt; then
                      cat shared-fs-native-address/address.txt
                      exit 0
                    fi
                    if ! kill -0 "$(cat native-interop-logs/linux-seed.pid)" 2>/dev/null; then
                      cat native-interop-logs/linux-seed.log
                      exit 1
                    fi
                    sleep 2
                  done

                  cat native-interop-logs/linux-seed.log
                  echo "Timed out waiting for Linux seed address"
                  exit 1

            - name: Upload shared filesystem address
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
              with:
                  name: shared-fs-native-address
                  path: shared-fs-native-address/address.txt
                  if-no-files-found: error

            - name: Wait for native mount peers
              shell: bash
              run: |
                  set -euo pipefail
                  while ! test -f native-interop-logs/linux-seed.exit; do
                    tail -n 80 native-interop-logs/linux-seed.log || true
                    sleep 10
                  done
                  cat native-interop-logs/linux-seed.log
                  node scripts/shared-fs-native-interop-metrics.mjs summary \
                    native-interop-metrics/linux-workflow.json \
                    native-interop-metrics/linux.json || true
                  exit "$(cat native-interop-logs/linux-seed.exit)"

            - name: Upload Linux timing
              if: always()
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
              with:
                  name: shared-fs-native-linux-timing-${{ github.run_id }}-${{ github.run_attempt }}
                  path: native-interop-metrics/*.json
                  if-no-files-found: warn
                  retention-days: 14

    windows-native-join:
        name: Windows WinFsp native join (${{ matrix.os }})
        needs: plan
        runs-on: ${{ matrix.os }}
        timeout-minutes: 60
        strategy:
            fail-fast: false
            matrix:
                os: ${{ fromJSON(needs.plan.outputs.joiners) }}
        steps:
            - name: Checkout
              uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

            - name: Setup pnpm
              uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
              with:
                  run_install: false

            - name: Setup Node
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
              with:
                  node-version: 22
                  cache: pnpm
                  cache-dependency-path: pnpm-lock.yaml

            - name: Setup Go
              uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
              with:
                  go-version: "1.24.x"
                  cache-dependency-path: packages/shared-fs/native/go.sum

            - name: Use Bash for pnpm scripts
              run: pnpm config set script-shell "C:\Program Files\Git\bin\bash.exe"

            - name: Install WinFsp
              shell: powershell
              run: |
                  choco install winfsp -y --no-progress --version=2.1.25156
                  $WinFspDll = @(
                    "C:\Program Files\WinFsp\bin\winfsp-x64.dll",
                    "C:\Program Files (x86)\WinFsp\bin\winfsp-x64.dll"
                  ) | Where-Object { Test-Path $_ } | Select-Object -First 1
                  if (-not $WinFspDll) {
                    throw "WinFsp is not installed."
                  }
                  Split-Path -Parent $WinFspDll | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

            - name: Install dependencies
              shell: powershell
              run: |
                  New-Item -ItemType Directory -Force -Path native-interop-metrics | Out-Null
                  $StartedMs = [DateTimeOffset]::UtcNow.ToUnixTimeMilliseconds()
                  $Status = 0
                  try {
                    $env:PEERBIT_SKIP_ROOT_POSTINSTALL = "1"
                    pnpm install --frozen-lockfile --prod --filter @peerbit/shared-fs... --filter @peerbit/shared-fs-cli...
                    if ($LASTEXITCODE -ne 0) {
                      throw "pnpm install failed with exit code $LASTEXITCODE"
                    }
                  } catch {
                    $Status = 1
                    throw
                  } finally {
                    $EndedMs = [DateTimeOffset]::UtcNow.ToUnixTimeMilliseconds()
                    node scripts/shared-fs-native-interop-metrics.mjs phase `
                      native-interop-metrics/${{ matrix.os }}-workflow.json `
                      ${{ matrix.os }} workflow installDependencies $StartedMs $EndedMs $Status
                  }

            - name: Build shared-fs packages
              shell: powershell
              run: |
                  New-Item -ItemType Directory -Force -Path native-interop-metrics | Out-Null
                  $StartedMs = [DateTimeOffset]::UtcNow.ToUnixTimeMilliseconds()
                  $Status = 0
                  try {
                    node scripts/shared-fs-build-packages.mjs
                    if ($LASTEXITCODE -ne 0) {
                      throw "shared-fs build failed with exit code $LASTEXITCODE"
                    }
                  } catch {
                    $Status = 1
                    throw
                  } finally {
                    $EndedMs = [DateTimeOffset]::UtcNow.ToUnixTimeMilliseconds()
                    node scripts/shared-fs-native-interop-metrics.mjs phase `
                      native-interop-metrics/${{ matrix.os }}-workflow.json `
                      ${{ matrix.os }} workflow buildSharedFs $StartedMs $EndedMs $Status
                  }

            - name: Wait for seed address artifact
              shell: powershell
              env:
                  GITHUB_TOKEN: ${{ github.token }}
              run: |
                  node scripts/wait-github-artifact.mjs shared-fs-native-address

            - name: Download seed address
              uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
              with:
                  name: shared-fs-native-address
                  path: shared-fs-native-address

            - name: Run Windows native mount join
              shell: powershell
              env:
                  PEERBIT_SHARED_FS_NATIVE_ADAPTER_DEBUG: "1"
                  EXPECTED_JOINERS: ${{ needs.plan.outputs.expected_joiners }}
              run: |
                  # Every other peer: the Linux seed and the other joiners.
                  $Expected = (@("linux") + ($env:EXPECTED_JOINERS -split "," | Where-Object { $_ -and $_ -ne "${{ matrix.os }}" })) -join ","
                  Write-Host "expecting: $Expected"
                  $TimeoutSeconds = [int]$env:NATIVE_INTEROP_TIMEOUT_MINUTES * 60
                  scripts/shared-fs-native-cross-os-interop.ps1 `
                    -Role join `
                    -Machine "${{ matrix.os }}" `
                    -Expected $Expected `
                    -ExpectedAcks $Expected `
                    -AddressFile shared-fs-native-address/address.txt `
                    -MetricsFile native-interop-metrics/${{ matrix.os }}.json `
                    -TimeoutSeconds $TimeoutSeconds

            - name: Report Windows timing
              if: always()
              shell: powershell
              run: |
                  node scripts/shared-fs-native-interop-metrics.mjs summary `
                    native-interop-metrics/${{ matrix.os }}-workflow.json `
                    native-interop-metrics/${{ matrix.os }}.json

            - name: Upload Windows timing
              if: always()
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
              with:
                  name: shared-fs-native-${{ matrix.os }}-timing-${{ github.run_id }}-${{ github.run_attempt }}
                  path: native-interop-metrics/*.json
                  if-no-files-found: warn
                  retention-days: 14
