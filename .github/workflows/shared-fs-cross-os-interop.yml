name: Shared FS Cross-OS Interop

# A Linux seed and macOS and Windows joiners (or one of them) open one shared
# filesystem: each peer writes its own file, then waits until it has read
# every other peer's, for at most INTEROP_TIMEOUT_MINUTES.
#
# Hosted runners can queue for a long time (macOS arm64 under capacity
# constraints), so the peers meet before that window starts. Once a peer job
# has built, it completes "Report interop presence", then waits in "Wait until
# every peer is ready" (scripts/shared-fs-interop-rendezvous.mjs) until every
# peer job has completed that step. Only then does the seed start its node
# and publish the address, and the joiners join: every peer's window starts
# once all of them have a runner. The wait fails at once when another peer's
# job has finished (it failed, was cancelled, never got a runner, or a re-run
# left it out: re-run all jobs, not only the failed ones). A peer counts only
# if its presence step completed within INTEROP_ARRIVAL_TIMEOUT_MINUTES of
# when the peer jobs were created, by the step's own time. Every peer reads
# the same times, and waits up to a minute past that deadline for the listing
# (a few seconds behind) to show them, so every peer reaches the same
# decision unless the listing falls further behind. It finds a peer's job by
# the "(<machine>)" that ends its name. A joiner then stops waiting for the
# seed's address as soon as the seed's job has finished without publishing
# it.
# The plan job sizes the peer jobs' time limit to hold the arrival budget as
# well as the interop, so a late peer never finds another's job at its limit.
on:
    pull_request:
        paths:
            - ".github/workflows/shared-fs-cross-os-interop.yml"
            - "package.json"
            - "pnpm-lock.yaml"
            - "tsconfig.json"
            - "vitest.config.ts"
            - "vitest.setup.ts"
            - "packages/shared-fs/**"
            - "scripts/shared-fs-interop-rendezvous*.mjs"
            - "scripts/shared-fs-interop-seed-steps.test.mjs"
    workflow_dispatch:
        inputs:
            timeout_minutes:
                description: "How long each peer waits for all OS files, once every peer is ready"
                required: true
                type: number
                default: 10
            arrival_timeout_minutes:
                description: "How long every peer has, from when the peer jobs are created, to get a runner and build (at least 5)"
                required: true
                type: number
                default: 45
            platform:
                description: "Join platform(s) to run with the Linux seed"
                required: true
                type: choice
                default: all
                options:
                    - all
                    - macos
                    - windows

permissions:
    actions: read
    contents: read

# A new push to a pull request cancels the run it supersedes, so that run
# stops waiting for its peers and frees their runners. Manual runs on one ref
# queue instead: GitHub keeps one waiting, and a newer one replaces it. A run
# reads only its own jobs and artifacts, so a cancelled run's peers never
# count in another run's rendezvous.
concurrency:
    group: shared-fs-cross-os-interop-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
    FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    INTEROP_TIMEOUT_MINUTES: ${{ github.event_name == 'workflow_dispatch' && inputs.timeout_minutes || '10' }}
    INTEROP_ARRIVAL_TIMEOUT_MINUTES: ${{ github.event_name == 'workflow_dispatch' && inputs.arrival_timeout_minutes || '45' }}

jobs:
    interop-plan:
        name: Plan interop peers
        runs-on: ubuntu-latest
        outputs:
            expected: ${{ steps.plan.outputs.expected }}
            matrix: ${{ steps.plan.outputs.matrix }}
            join_step_timeout_minutes: ${{ steps.budgets.outputs.join_step_timeout_minutes }}
            peer_job_timeout_minutes: ${{ steps.budgets.outputs.peer_job_timeout_minutes }}
        steps:
            - name: Select peers
              id: plan
              shell: bash
              env:
                  PLATFORM: ${{ github.event_name == 'workflow_dispatch' && inputs.platform || 'all' }}
              run: |
                  set -euo pipefail
                  case "$PLATFORM" in
                    all)
                      expected="linux,macos,windows"
                      matrix='{"include":[{"os":"macos-latest","machine":"macos"},{"os":"windows-latest","machine":"windows"}]}'
                      ;;
                    macos)
                      expected="linux,macos"
                      matrix='{"include":[{"os":"macos-latest","machine":"macos"}]}'
                      ;;
                    windows)
                      expected="linux,windows"
                      matrix='{"include":[{"os":"windows-latest","machine":"windows"}]}'
                      ;;
                    *)
                      echo "Unsupported platform: $PLATFORM" >&2
                      exit 1
                      ;;
                  esac

                  {
                    echo "expected=$expected"
                    echo "matrix<<JSON"
                    echo "$matrix"
                    echo "JSON"
                  } >> "$GITHUB_OUTPUT"

            - name: Size time budgets
              id: budgets
              shell: bash
              run: |
                  set -euo pipefail
                  for minutes in "$INTEROP_TIMEOUT_MINUTES" "$INTEROP_ARRIVAL_TIMEOUT_MINUTES"; do
                    if ! [[ "$minutes" =~ ^[1-9][0-9]*$ ]]; then
                      echo "::error::Timeouts are whole minutes above zero, got '$minutes'"
                      exit 1
                    fi
                  done
                  window="$INTEROP_TIMEOUT_MINUTES"
                  arrival="$INTEROP_ARRIVAL_TIMEOUT_MINUTES"
                  if [ "$arrival" -lt 5 ]; then
                    echo "::error::arrival_timeout_minutes counts from when the peer jobs are created, so it holds their setup and build: it must be at least 5, got $arrival"
                    exit 1
                  fi
                  # A joiner may spend a window on write readiness and another
                  # on the files, then reports and stops.
                  join_step=$((2 * window + 5))
                  # The peer jobs' step limits for install and build.
                  install=10
                  build=5
                  # A peer job's limit adds up checkout and tool setup (5),
                  # install and build, the wait for every peer (the arrival
                  # budget, and the minute past its deadline in which the
                  # peers wait for the listing to show presence from before
                  # it), the seed's start or a joiner's address download (15;
                  # step limits cap both), the interop (the join step's limit;
                  # the seed stops waiting a window + 5 after its start) and
                  # teardown (5). The arrival budget counts from when the peer
                  # jobs were created, so it already holds a job's own queue,
                  # setup and build: no peer's job reaches its limit while a
                  # peer that arrived within the budget can still need it.
                  peer_job=$((5 + install + build + arrival + 1 + 15 + join_step + 5))
                  if [ "$peer_job" -gt 360 ]; then
                    echo "::error::A peer job would need up to ${peer_job} minutes, past the 360 a hosted job may run: lower timeout_minutes or arrival_timeout_minutes"
                    exit 1
                  fi
                  {
                    echo "join_step_timeout_minutes=$join_step"
                    echo "peer_job_timeout_minutes=$peer_job"
                  } >> "$GITHUB_OUTPUT"
                  echo "interop window ${window} min, arrival budget ${arrival} min; install and build step limits ${install} and ${build} min, join step limit ${join_step} min, peer job limit ${peer_job} min"

            - name: Checkout
              uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
              with:
                  sparse-checkout: |
                      .github/workflows
                      scripts

            - name: Test rendezvous script
              timeout-minutes: 5
              run: node --test scripts/shared-fs-interop-rendezvous.test.mjs

            - name: Test seed steps
              timeout-minutes: 5
              run: node --test scripts/shared-fs-interop-seed-steps.test.mjs

    seed-linux:
        name: Seed peer (linux)
        needs: interop-plan
        runs-on: ubuntu-latest
        timeout-minutes: ${{ fromJSON(needs.interop-plan.outputs.peer_job_timeout_minutes) }}

        steps:
            - name: Checkout
              uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

            - name: Setup pnpm
              uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
              with:
                  run_install: false

            - name: Setup Node
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
              with:
                  node-version: 22
                  cache: pnpm
                  cache-dependency-path: pnpm-lock.yaml

            # The plan job adds up these two step limits ("Size time budgets").
            - name: Install dependencies
              timeout-minutes: 10
              run: pnpm install --frozen-lockfile

            - name: Build shared-fs packages
              timeout-minutes: 5
              run: pnpm -r --sort --filter @peerbit/shared-fs --filter @peerbit/shared-fs-cli run build

            - name: Report interop presence
              shell: bash
              run: echo "linux has built and is ready to start its node"

            - name: Wait until every peer is ready
              shell: bash
              env:
                  GH_TOKEN: ${{ github.token }}
                  INTEROP_EXPECTED_MACHINES: ${{ needs.interop-plan.outputs.expected }}
              run: |
                  node scripts/shared-fs-interop-rendezvous.mjs \
                    --machine linux \
                    --expected "$INTEROP_EXPECTED_MACHINES" \
                    --arrival-timeout-minutes "$INTEROP_ARRIVAL_TIMEOUT_MINUTES"

            - name: Start seed peer
              shell: bash
              timeout-minutes: 10
              env:
                  INTEROP_EXPECTED_MACHINES: ${{ needs.interop-plan.outputs.expected }}
              run: |
                  set -euo pipefail
                  mkdir -p shared-fs-address interop-logs
                  timeout_ms=$((INTEROP_TIMEOUT_MINUTES * 60 * 1000))
                  (
                    # Without set +e, a nonzero exit from node ends this
                    # subshell before it records the status.
                    set +e
                    node packages/shared-fs/cli/lib/esm/cross-os-interop.js \
                      --role seed \
                      --machine linux \
                      --expected "$INTEROP_EXPECTED_MACHINES" \
                      --address-file shared-fs-address/address.txt \
                      --timeout-ms "$timeout_ms" \
                      --directory .peerbit-shared-fs-interop-linux \
                      > interop-logs/linux-seed.log 2>&1
                    status="$?"
                    echo "$status" > interop-logs/linux-seed.exit
                    exit "$status"
                  ) &
                  echo "$!" > interop-logs/linux-seed.pid

                  for _ in {1..120}; do
                    if test -s shared-fs-address/address.txt; then
                      cat shared-fs-address/address.txt
                      exit 0
                    fi
                    if ! kill -0 "$(cat interop-logs/linux-seed.pid)" 2>/dev/null; then
                      cat interop-logs/linux-seed.log
                      exit 1
                    fi
                    sleep 2
                  done

                  cat interop-logs/linux-seed.log
                  echo "Timed out waiting for seed address"
                  exit 1

            - name: Upload shared filesystem address
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
              with:
                  # A re-run keeps the earlier attempts' artifacts, so the
                  # joiners look for this attempt's address by name.
                  name: shared-fs-address-${{ github.run_attempt }}
                  path: shared-fs-address/address.txt
                  if-no-files-found: error

            - name: Wait for all OS peers
              shell: bash
              run: |
                  set -euo pipefail
                  # The seed exits within its window; stop waiting for one
                  # that outlives it by 5 minutes.
                  limit=$(( (INTEROP_TIMEOUT_MINUTES + 5) * 60 ))
                  while ! test -f interop-logs/linux-seed.exit; do
                    if [ "$SECONDS" -ge "$limit" ]; then
                      cat interop-logs/linux-seed.log
                      echo "::error::The seed peer has not exited $((INTEROP_TIMEOUT_MINUTES + 5)) minutes after it started, 5 minutes past its ${INTEROP_TIMEOUT_MINUTES}-minute window"
                      exit 1
                    fi
                    tail -n 40 interop-logs/linux-seed.log || true
                    sleep 10
                  done
                  cat interop-logs/linux-seed.log
                  exit "$(cat interop-logs/linux-seed.exit)"

    join:
        name: Join peer (${{ matrix.machine }})
        needs: interop-plan
        runs-on: ${{ matrix.os }}
        timeout-minutes: ${{ fromJSON(needs.interop-plan.outputs.peer_job_timeout_minutes) }}
        strategy:
            fail-fast: false
            matrix: ${{ fromJSON(needs.interop-plan.outputs.matrix) }}

        steps:
            - name: Checkout
              uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

            - name: Setup pnpm
              uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
              with:
                  run_install: false

            - name: Setup Node
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
              with:
                  node-version: 22
                  cache: pnpm
                  cache-dependency-path: pnpm-lock.yaml

            - name: Use Bash for pnpm scripts on Windows
              if: runner.os == 'Windows'
              run: pnpm config set script-shell "C:\\Program Files\\Git\\bin\\bash.exe"

            # The plan job adds up these two step limits ("Size time budgets").
            - name: Install dependencies
              timeout-minutes: 10
              run: pnpm install --frozen-lockfile

            - name: Build shared-fs packages
              timeout-minutes: 5
              run: pnpm -r --sort --filter @peerbit/shared-fs --filter @peerbit/shared-fs-cli run build

            - name: Report interop presence
              shell: bash
              env:
                  INTEROP_MACHINE: ${{ matrix.machine }}
              run: echo "$INTEROP_MACHINE has built and is ready to start its node"

            - name: Wait until every peer is ready
              shell: bash
              env:
                  GH_TOKEN: ${{ github.token }}
                  INTEROP_EXPECTED_MACHINES: ${{ needs.interop-plan.outputs.expected }}
                  INTEROP_MACHINE: ${{ matrix.machine }}
              run: |
                  node scripts/shared-fs-interop-rendezvous.mjs \
                    --machine "$INTEROP_MACHINE" \
                    --expected "$INTEROP_EXPECTED_MACHINES" \
                    --arrival-timeout-minutes "$INTEROP_ARRIVAL_TIMEOUT_MINUTES"

            # Waits for this attempt's shared-fs-address-<attempt> artifact,
            # for at most 13 minutes, and fails at once when the seed's job
            # has finished without publishing it.
            - name: Download seed address
              shell: bash
              timeout-minutes: 15
              env:
                  GH_TOKEN: ${{ github.token }}
                  INTEROP_MACHINE: ${{ matrix.machine }}
              run: |
                  node scripts/shared-fs-interop-rendezvous.mjs \
                    --machine "$INTEROP_MACHINE" \
                    --seed linux \
                    --seed-address shared-fs-address

            - name: Join shared filesystem
              shell: bash
              timeout-minutes: ${{ fromJSON(needs.interop-plan.outputs.join_step_timeout_minutes) }}
              env:
                  INTEROP_EXPECTED_MACHINES: ${{ needs.interop-plan.outputs.expected }}
              run: |
                  set -euo pipefail
                  timeout_ms=$((INTEROP_TIMEOUT_MINUTES * 60 * 1000))
                  node packages/shared-fs/cli/lib/esm/cross-os-interop.js \
                    --role join \
                    --machine "${{ matrix.machine }}" \
                    --expected "$INTEROP_EXPECTED_MACHINES" \
                    --address-file shared-fs-address/address.txt \
                    --timeout-ms "$timeout_ms" \
                    --directory ".peerbit-shared-fs-interop-${{ matrix.machine }}"
